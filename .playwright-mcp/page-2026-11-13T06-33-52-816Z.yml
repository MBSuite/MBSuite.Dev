- generic [active] [ref=e1]: "/* ============================================================ HERO CYBER — IMPROVED ANIMATION DRAFT STATUS: DRAFT ONLY — NOT applied to project source. Goal: improve hero background animation so aurora is clearly visible (stronger opacities) + smoother independent drift + shimmer sweep. ============================================================ */ .hero-cyber { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--dark-bg) 0%, var(--dark-surface) 50%, var(--dark-accent) 100%); overflow: hidden; padding: 40px; } /* --- Layer 1: Aurora radial blobs (drift) --- */ .hero-cyber::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 20% 50%, rgba(var(--neon-cyan-rgb), 0.45) 0%, transparent 50%), radial-gradient(circle at 80% 50%, rgba(var(--neon-purple-rgb), 0.45) 0%, transparent 50%), radial-gradient(circle at 50% 20%, rgba(255, 0, 110, 0.35) 0%, transparent 50%); pointer-events: none; animation: aurora-drift 16s ease-in-out infinite; z-index: -1; } @keyframes aurora-drift { 0% { transform: translate3d(0, 0, 0) scale(1); } 33% { transform: translate3d(50px, -40px, 0) scale(1.12); } 66% { transform: translate3d(-50px, 30px, 0) scale(0.94); } 100% { transform: translate3d(0, 0, 0) scale(1); } } /* --- Layer 2: Aurora shimmer sweep --- */ .hero-cyber::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(115deg, transparent 0%, rgba(0, 240, 255, 0.07) 40%, rgba(208, 0, 255, 0.07) 60%, transparent 100%); background-size: 250% 100%; background-position: 150% 0; pointer-events: none; animation: aurora-shimmer 10s ease-in-out infinite; } @keyframes aurora-shimmer { 0% { background-position: 150% 0; } 100% { background-position: -150% 0; } } /* --- Title gradient animation (kept from existing) --- */ .hero-cyber-title { font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 900; line-height: 1.1; letter-spacing: -0.03em; background: linear-gradient(90deg, var(--neon-cyan) 0%, var(--neon-purple) 25%, var(--neon-pink) 50%, var(--neon-blue) 75%, var(--neon-cyan) 100%); background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: rainbow-flow 6s ease-in-out infinite; margin: 0 0 24px; filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.3)); } .hero-cyber-subtitle { font-size: clamp(1rem, 2vw, 1.5rem); color: var(--text-secondary); margin: 0 0 40px; font-weight: 300; letter-spacing: 0.05em; animation: fade-in-up 1s ease-out 0.3s both; } .hero-cyber-cta { display: inline-flex; gap: 16px; flex-wrap: wrap; justify-content: center; animation: fade-in-up 1s ease-out 0.5s both; } @media (max-width: 768px) { .hero-cyber { min-height: 80vh; padding: 20px; } .hero-cyber::before { background: radial-gradient(circle at 20% 50%, rgba(var(--neon-cyan-rgb), 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 50%, rgba(var(--neon-purple-rgb), 0.1) 0%, transparent 50%); } .hero-cyber-title { font-size: 2rem; } .hero-cyber-subtitle { font-size: 1rem; } .hero-cyber-cta { flex-direction: column; gap: 12px; width: 100%; } .hero-cyber-cta .btn-neon { width: 100%; } }"